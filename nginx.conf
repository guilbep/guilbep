worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log  /dev/stdout  main;
  error_log   /dev/stderr  warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # gzip: matters most for the inlined-CSS HTML payloads and the XML sitemaps.
  # Threshold is below the smallest HTML we emit so even tiny files compress.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.0;
  gzip_min_length 256;
  gzip_types
    text/plain text/css text/javascript application/javascript application/x-javascript
    text/xml application/xml application/xml+rss application/json application/manifest+json
    image/svg+xml;

  server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness check.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Everything under /assets/ is hashed and content-addressed → cache forever.
    location /assets/ {
      access_log off;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # XML sitemaps, webmanifest, PDFs, vCard: short-lived public cache.
    location ~* \.(xml|webmanifest|pdf|vcf)$ {
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
      try_files $uri =404;
    }

    # HTML: don't cache. New deploys take effect immediately.
    location ~* \.html$ {
      expires -1y;
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # Default: try the file, then the directory (e.g. /en/ → /en/index.html),
    # then fall back to root /index.html (the language-detection redirect).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
